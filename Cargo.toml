[package]
name = "todont"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A todo list for the terminal (CLI + TUI) that syncs between devices through a self-hosted server and sends reminders to your phone via ntfy"
license = "MIT"
authors = ["Daniel Di Giovanni"]
repository = "https://github.com/Danpythonman/todont"
readme = "README.md"
keywords = ["todo", "tui", "cli", "ntfy", "sync"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
jiff = "0.2.37"
uuid = { version = "1.26.1", features = ["v4"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
ureq = { version = "3.4.2", features = ["json"] }
toml = "1.1.6"

[[bin]]
name = "td"
path = "src/main.rs"

[profile.release]
strip = true
